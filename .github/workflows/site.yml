name: Site

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out and build. Defaults to the triggering ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache-dependency-path: gh-pages/yarn.lock
          node-version: latest
          cache: yarn

      - name: Install dependencies
        working-directory: gh-pages
        run: yarn --immutable

      - name: Check types
        working-directory: gh-pages
        run: yarn typecheck

      - name: Build site
        working-directory: gh-pages
        run: yarn build

      - name: Verify build output
        run: |
          set -euo pipefail

          dist=gh-pages/dist/client
          status=0

          fail() {
            echo "::error::$1"
            status=1
          }

          [ -s "$dist/index.html" ] || fail "$dist/index.html is missing or empty."

          while IFS= read -r asset; do
            served="$dist/${asset#gh-pages/public/}"

            if [ ! -s "$served" ]; then
              fail "$asset was not emitted to $served."
            elif ! cmp -s "$asset" "$served"; then
              fail "$served does not match $asset."
            fi
          done < <(find gh-pages/public -type f)

          for pair in install.sh:install.sh install.ps1:install.ps1 install.ps1:install.ps1.txt; do
            source="scripts/${pair%%:*}"
            served="$dist/${pair##*:}"

            if [ ! -s "$served" ]; then
              fail "$source was not emitted to $served."
            elif ! cmp -s "$source" "$served"; then
              fail "$served does not match $source."
            fi
          done

          if [ -s "$dist/index.html" ]; then
            body=$(
              sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' "$dist/index.html" |
                tr -s '[:space:]' ' ' |
                sed -e 's/^ //' -e 's/ $//'
            )
            title=$(grep -o '<title>[^<]*</title>' "$dist/index.html" | sed -e 's/<[^>]*>//g' || true)

            [ -n "$title" ] || fail "index.html has no page title, prerendering may have failed."
            [ -n "$body" ] || fail "index.html has no rendered text, prerendering may have failed."
          fi

          exit $status
